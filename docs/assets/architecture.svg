<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Steward architecture: brief, queue, manager, session, watchdog, usage window, wind-down and resume"><title>Steward architecture: brief, queue, manager, session, watchdog, usage window, wind-down and resume</title><rect width="1000" height="440" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><rect x="30" y="40" width="170" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="115.0" y="68.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">Brief</text><text x="115.0" y="88.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">brief.md</text><rect x="260" y="40" width="190" height="64" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="355.0" y="68.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">Queue</text><text x="355.0" y="88.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">stewardq.py add / tick</text><rect x="510" y="40" width="210" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="615.0" y="68.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">Manager</text><text x="615.0" y="88.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">agentctl.py run / resume</text><rect x="780" y="40" width="190" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="875.0" y="68.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">Claude Code session</text><text x="875.0" y="88.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">claude -p, stream-json</text><line x1="200" y1="72" x2="260" y2="72" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/><line x1="450" y1="72" x2="510" y2="72" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/><text x="480" y="64" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">due</text><line x1="720" y1="72" x2="780" y2="72" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/><text x="750" y="64" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">launch</text><line x1="780" y1="90" x2="720" y2="90" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/><text x="750" y="112" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">events</text><rect x="510" y="190" width="210" height="70" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="615.0" y="221.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">Watchdog</text><text x="615.0" y="241.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">checks usage every 20 s</text><line x1="615" y1="104" x2="615" y2="190" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/><rect x="780" y="190" width="190" height="70" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/><text x="875.0" y="221.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">Usage window</text><text x="875.0" y="241.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">health/usage.json</text><rect x="780" y="320" width="190" height="64" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/><text x="875.0" y="348.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">Status line sensor</text><text x="875.0" y="368.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">statusline/usage_statusline.py</text><line x1="875" y1="320" x2="875" y2="260" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/><text x="905" y="294" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">writes</text><line x1="780" y1="225" x2="720" y2="225" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/><text x="750" y="217" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">reads</text><rect x="260" y="190" width="190" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="355.0" y="221.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">Wind-down</text><text x="355.0" y="241.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">SIGTERM at the threshold</text><line x1="510" y1="225" x2="450" y2="225" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="190" width="170" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="115.0" y="221.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">Run directory</text><text x="115.0" y="241.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">session id, log, checkpoint</text><line x1="260" y1="235" x2="200" y2="235" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/><line x1="355" y1="190" x2="355" y2="104" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="30" y="320" width="170" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="115.0" y="348.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">Resume</text><text x="115.0" y="368.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">same session, same conversation</text><line x1="355" y1="260" x2="200" y2="345" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="360" y="150" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#dc2626">queues a resume for reset + 2 min</text><text x="205" y="322" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#15803d">after the reset</text><text x="500" y="420" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">A wound-down run queues its own resume. The queue starts it after the window resets, with the conversation intact.</text></svg>