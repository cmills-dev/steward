<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Lifecycle of a Steward run and its exit codes"><title>Lifecycle of a Steward run and its exit codes</title><rect width="900" height="430" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><rect x="30" y="120" width="130" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="95.0" y="153.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">starting</text><rect x="220" y="120" width="130" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="285.0" y="144.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">running</text><text x="285.0" y="164.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">claude -p</text><line x1="160" y1="148" x2="220" y2="148" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/><rect x="450" y="20" width="160" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="530.0" y="44.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">done</text><text x="530.0" y="64.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">exit 0</text><rect x="450" y="100" width="160" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="530.0" y="124.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">dormant</text><text x="530.0" y="144.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">exit 76, wound down</text><rect x="450" y="180" width="160" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="530.0" y="204.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">limited</text><text x="530.0" y="224.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">exit 77, hit the limit</text><rect x="450" y="260" width="160" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="530.0" y="284.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">interrupted</text><text x="530.0" y="304.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">exit 80, network lost</text><rect x="450" y="340" width="160" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="530.0" y="364.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">timed-out</text><text x="530.0" y="384.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">exit 78, time cap</text><rect x="700" y="20" width="170" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="785.0" y="44.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">failed, no-op, refused</text><text x="785.0" y="64.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">exit 1, 83, 84 (end of run)</text><rect x="700" y="340" width="170" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="785.0" y="364.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">killed, out-of-credits</text><text x="785.0" y="384.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">exit 79, 82 (end of run)</text><line x1="350" y1="148" x2="450" y2="48" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/><line x1="350" y1="148" x2="450" y2="128" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/><line x1="350" y1="148" x2="450" y2="208" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/><line x1="350" y1="148" x2="450" y2="288" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/><line x1="350" y1="148" x2="450" y2="368" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/><path d="M530 100 C530 70 430 70 330 120" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="30" y="220" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#15803d">Dashed green: the queued resume after the reset,</text><text x="30" y="236" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#15803d">same session id, so the conversation comes back.</text><text x="30" y="410" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">Dormant, limited, interrupted and timed-out runs can resume. A crash writes crash.md with the last log lines and the resume command.</text><text x="30" y="290" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">Context past 130k tokens rotates to a fresh</text><text x="30" y="306" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">session from the brief and checkpoint (running stays running).</text></svg>