<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 322" width="1040" height="322" role="img" aria-label="Terminal output of steward status showing a running, a dormant and a finished run"><title>steward status</title><rect width="1040" height="322" rx="12" fill="#0f172a"/><rect width="1040" height="36" rx="12" fill="#1e293b"/><rect y="24" width="1040" height="12" fill="#1e293b"/><circle cx="22" cy="18" r="6" fill="#ef4444"/><circle cx="42" cy="18" r="6" fill="#f59e0b"/><circle cx="62" cy="18" r="6" fill="#22c55e"/><text x="520.0" y="23" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#94a3b8">steward status (demo run, fake ids)</text><text x="24" y="66" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">$ python3 agentctl.py status</text><text x="24" y="88" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#cbd5e1" xml:space="preserve">usage: 91% of the 5-hour window, resets 16:00 (1 min old, fresh)</text><text x="24" y="110" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#94a3b8" xml:space="preserve">id                               status     updated          resumes cost    reason</text><text x="24" y="132" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#cbd5e1" xml:space="preserve">nightly-tidy                     running    01 Oct 14:05     0       -       </text><text x="24" y="154" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#fbbf24" xml:space="preserve">add-json-flag                    dormant    01 Oct 14:02     1       $3.18   usage at 91% (threshold 90%)  resume 16:02</text><text x="24" y="176" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#86efac" xml:space="preserve">docs-refresh                     done       01 Oct 11:40     0       $0.41   finished</text><text x="24" y="198" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#cbd5e1" xml:space="preserve"></text><text x="24" y="220" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e2e8f0" xml:space="preserve">$ python3 stewardq.py list</text><text x="24" y="242" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#cbd5e1" xml:space="preserve">pending: 2</text><text x="24" y="264" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#cbd5e1" xml:space="preserve">  Thu 01 Oct 16:02  resume  Resume agent add-json-flag</text><text x="24" y="286" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#cbd5e1" xml:space="preserve">  Fri 02 Oct 03:30  brief   Nightly tidy</text></svg>